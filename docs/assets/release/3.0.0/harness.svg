<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="The HashCoder harness: it reads the project, plans ask by ask, edits under your permission mode, proves the change with your tests, takes a second look at larger changes, and sends itself back until the work is proven. It is fitted to small, mid-sized and large models.">
  <defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b6d2c"/>
    <stop offset="0.28" stop-color="#c9a96e"/>
    <stop offset="0.5" stop-color="#f6e7c1"/>
    <stop offset="0.72" stop-color="#c9a96e"/>
    <stop offset="1" stop-color="#8b6d2c"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9a96e" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#c9a96e" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#c9a96e" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#c9a96e" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="640" rx="18"/></clipPath></defs>
  <g clip-path="url(#card)">
  <rect width="1280" height="640" fill="#06070a"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
  <text x="64" y="66" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#c9a96e">THE HASHCODER HARNESS</text>
  <text x="64" y="106" font-size="30" font-weight="700" fill="#f2efe8" letter-spacing="-0.5">Every run is checked by the app, not by the model's word.</text>
  <rect x="64.0" y="150" width="177.0" height="170" rx="12" fill="#0d1117" fill-opacity="1" stroke="#c9a96e" stroke-opacity="0.3"/><text x="84.0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#c9a96e">01</text><text x="84.0" y="232" font-size="24" font-weight="650" fill="#f2efe8">Reads</text><text x="84.0" y="266" font-size="14" fill="#9a978f">The project, its</text><text x="84.0" y="286" font-size="14" fill="#9a978f">notes for agents,</text><text x="84.0" y="306" font-size="14" fill="#9a978f">its latest commits</text><path d="M243.0 235.0 l12 0" stroke="#c9a96e" stroke-width="1.6"/><path d="M252.0 231.0 l5 4 l-5 4" fill="none" stroke="#c9a96e" stroke-width="1.6"/><rect x="259.0" y="150" width="177.0" height="170" rx="12" fill="#0d1117" fill-opacity="1" stroke="#c9a96e" stroke-opacity="0.3"/><text x="279.0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#c9a96e">02</text><text x="279.0" y="232" font-size="24" font-weight="650" fill="#f2efe8">Plans</text><text x="279.0" y="266" font-size="14" fill="#9a978f">Your request,</text><text x="279.0" y="286" font-size="14" fill="#9a978f">split ask by ask</text><path d="M438.0 235.0 l12 0" stroke="#c9a96e" stroke-width="1.6"/><path d="M447.0 231.0 l5 4 l-5 4" fill="none" stroke="#c9a96e" stroke-width="1.6"/><rect x="454.0" y="150" width="177.0" height="170" rx="12" fill="#0d1117" fill-opacity="1" stroke="#c9a96e" stroke-opacity="0.3"/><text x="474.0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#c9a96e">03</text><text x="474.0" y="232" font-size="24" font-weight="650" fill="#f2efe8">Edits</text><text x="474.0" y="266" font-size="14" fill="#9a978f">Diffs to keep or</text><text x="474.0" y="286" font-size="14" fill="#9a978f">undo, under your</text><text x="474.0" y="306" font-size="14" fill="#9a978f">permission mode</text><path d="M633.0 235.0 l12 0" stroke="#c9a96e" stroke-width="1.6"/><path d="M642.0 231.0 l5 4 l-5 4" fill="none" stroke="#c9a96e" stroke-width="1.6"/><rect x="649.0" y="150" width="177.0" height="170" rx="12" fill="#c9a96e" fill-opacity="0.09" stroke="#c9a96e" stroke-opacity="0.75"/><text x="669.0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#c9a96e">04</text><text x="669.0" y="232" font-size="24" font-weight="650" fill="#f2efe8">Proves</text><text x="669.0" y="266" font-size="14" fill="#9a978f">Runs your tests,</text><text x="669.0" y="286" font-size="14" fill="#9a978f">reads a site the</text><text x="669.0" y="306" font-size="14" fill="#9a978f">way a browser does</text><path d="M828.0 235.0 l12 0" stroke="#c9a96e" stroke-width="1.6"/><path d="M837.0 231.0 l5 4 l-5 4" fill="none" stroke="#c9a96e" stroke-width="1.6"/><rect x="844.0" y="150" width="177.0" height="170" rx="12" fill="#0d1117" fill-opacity="1" stroke="#c9a96e" stroke-opacity="0.3"/><text x="864.0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#c9a96e">05</text><text x="864.0" y="232" font-size="24" font-weight="650" fill="#f2efe8">Reviews</text><text x="864.0" y="266" font-size="14" fill="#9a978f">A second look</text><text x="864.0" y="286" font-size="14" fill="#9a978f">at larger changes</text><path d="M1023.0 235.0 l12 0" stroke="#c9a96e" stroke-width="1.6"/><path d="M1032.0 231.0 l5 4 l-5 4" fill="none" stroke="#c9a96e" stroke-width="1.6"/><rect x="1039.0" y="150" width="177.0" height="170" rx="12" fill="#c9a96e" fill-opacity="0.09" stroke="#c9a96e" stroke-opacity="0.75"/><text x="1059.0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#c9a96e">06</text><text x="1059.0" y="232" font-size="24" font-weight="650" fill="#f2efe8">Sends back</text><text x="1059.0" y="266" font-size="14" fill="#9a978f">Missed asks,</text><text x="1059.0" y="286" font-size="14" fill="#9a978f">leftovers and</text><text x="1059.0" y="306" font-size="14" fill="#9a978f">unsourced details</text>
  <path d="M1127.5 324 V354 H542.5 V330" fill="none" stroke="#c9a96e" stroke-width="1.6" stroke-dasharray="5 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M537.5 335 l5 -6 l5 6" fill="none" stroke="#c9a96e" stroke-width="1.6"/>
    <rect x="630.0" y="341" width="410" height="26" rx="13" fill="#06070a"/>
    <text x="835.0" y="359" text-anchor="middle" font-size="14" fill="#dfc38e">until the work is proven, not until the model says so</text>
  <text x="64" y="430" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#c9a96e">FITTED TO THE MODEL YOU CHOSE</text><rect x="64.0" y="452" width="368.0" height="140" rx="12" fill="#0d1117" stroke="#c9a96e" stroke-opacity="0.25"/><text x="86.0" y="486" font-size="13.5" fill="#c9a96e" letter-spacing="0.4">Small, under 5B</text><text x="86.0" y="516" font-size="21" font-weight="650" fill="#f2efe8">Light mode</text><text x="86.0" y="542" font-size="14" fill="#9a978f">The model writes whole files;</text><text x="86.0" y="561" font-size="14" fill="#9a978f">HashCortx does the tool work</text><text x="86.0" y="580" font-size="14" fill="#9a978f">and runs the tests for it.</text><rect x="456.0" y="452" width="368.0" height="140" rx="12" fill="#0d1117" stroke="#c9a96e" stroke-opacity="0.25"/><text x="478.0" y="486" font-size="13.5" fill="#c9a96e" letter-spacing="0.4">Mid-sized, 5B to 15B</text><text x="478.0" y="516" font-size="21" font-weight="650" fill="#f2efe8">Focused tools</text><text x="478.0" y="542" font-size="14" fill="#9a978f">The tools a coding task needs,</text><text x="478.0" y="561" font-size="14" fill="#9a978f">its steps written out, and</text><text x="478.0" y="580" font-size="14" fill="#9a978f">a plan for longer requests.</text><rect x="848.0" y="452" width="368.0" height="140" rx="12" fill="#0d1117" stroke="#c9a96e" stroke-opacity="0.25"/><text x="870.0" y="486" font-size="13.5" fill="#c9a96e" letter-spacing="0.4">15B and up, and cloud</text><text x="870.0" y="516" font-size="21" font-weight="650" fill="#f2efe8">The full harness</text><text x="870.0" y="542" font-size="14" fill="#9a978f">A map of your code, lessons</text><text x="870.0" y="561" font-size="14" fill="#9a978f">per project, and a reviewer</text><text x="870.0" y="580" font-size="14" fill="#9a978f">for larger changes.</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="639" rx="17.5" fill="none" stroke="#c9a96e" stroke-opacity="0.35"/>
</svg>
