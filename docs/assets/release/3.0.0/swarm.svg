<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="The Agent Swarm: your task is read, the details only you can give are asked for, what the team owes is worked out, and a team sized to the task runs on any mix of local and cloud models. The result holds every file and version, opens in the browser, can finish agents that did not, and exports a report for bugs.">
  <defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b6d2c"/>
    <stop offset="0.28" stop-color="#c9a96e"/>
    <stop offset="0.5" stop-color="#f6e7c1"/>
    <stop offset="0.72" stop-color="#c9a96e"/>
    <stop offset="1" stop-color="#8b6d2c"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9a96e" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#c9a96e" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#c9a96e" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#c9a96e" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="470" rx="18"/></clipPath></defs>
  <g clip-path="url(#card)">
  <rect width="1280" height="470" fill="#06070a"/>
  <rect width="1280" height="470" fill="url(#grid)"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
  <text x="64" y="62" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#c9a96e">THE AGENT SWARM</text>
  <text x="64" y="100" font-size="30" font-weight="700" fill="#f2efe8" letter-spacing="-0.5">Describe the task. The team is designed around it.</text>
  <rect x="64" y="150" width="230" height="150" rx="12" fill="#0d1117" stroke="#c9a96e" stroke-opacity="0.3"/><text x="86" y="186" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="2" fill="#c9a96e">YOUR TASK</text><text x="86" y="222" font-size="17" fill="#f2efe8">"A shop for my</text><text x="86" y="246" font-size="17" fill="#f2efe8">bakery, with a cart</text><text x="86" y="270" font-size="17" fill="#f2efe8">and an order form"</text><rect x="350" y="128" width="268" height="52" rx="26" fill="#c9a96e" fill-opacity="0.08" stroke="#c9a96e" stroke-opacity="0.55"/><text x="374" y="160" font-size="16" fill="#f2efe8"><tspan font-weight="650" fill="#dfc38e">Asks</tspan> what only you can give</text><rect x="350" y="194" width="268" height="52" rx="26" fill="#c9a96e" fill-opacity="0.08" stroke="#c9a96e" stroke-opacity="0.55"/><text x="374" y="226" font-size="16" fill="#f2efe8"><tspan font-weight="650" fill="#dfc38e">Works out</tspan> what the team owes</text><rect x="350" y="260" width="268" height="52" rx="26" fill="#c9a96e" fill-opacity="0.08" stroke="#c9a96e" stroke-opacity="0.55"/><text x="374" y="292" font-size="16" fill="#f2efe8"><tspan font-weight="650" fill="#dfc38e">Sizes</tspan> the team to the task</text><path d="M296 225 H342" stroke="#c9a96e" stroke-width="1.6"/><path d="M338 220 l6 5 l-6 5" fill="none" stroke="#c9a96e" stroke-width="1.6"/><path d="M620 225 H668" stroke="#c9a96e" stroke-width="1.6"/><path d="M664 220 l6 5 l-6 5" fill="none" stroke="#c9a96e" stroke-width="1.6"/><path d="M868 140 C905 140 900 225 934 225" fill="none" stroke="#c9a96e" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.4s" repeatCount="indefinite"/></path><path d="M868 225 C905 225 900 225 934 225" fill="none" stroke="#c9a96e" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.4s" repeatCount="indefinite"/></path><path d="M868 310 C905 310 900 225 934 225" fill="none" stroke="#c9a96e" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.4s" repeatCount="indefinite"/></path><circle cx="700" cy="140" r="24" fill="#06070a" stroke="#c9a96e" stroke-width="1.3"/><circle cx="700" cy="140" r="15" fill="#c9a96e" fill-opacity="0.16"/><text x="736" y="138" text-anchor="start" font-size="15.5" font-weight="600" fill="#f2efe8">Lead Developer</text><text x="736" y="157" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.5" fill="#9a978f">CLOUD MODEL</text><circle cx="700" cy="225" r="24" fill="#06070a" stroke="#c9a96e" stroke-width="1.3"/><circle cx="700" cy="225" r="15" fill="#c9a96e" fill-opacity="0.16"/><text x="736" y="223" text-anchor="start" font-size="15.5" font-weight="600" fill="#f2efe8">Designer</text><text x="736" y="242" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.5" fill="#9a978f">LOCAL MODEL</text><circle cx="700" cy="310" r="24" fill="#06070a" stroke="#c9a96e" stroke-width="1.3"/><circle cx="700" cy="310" r="15" fill="#c9a96e" fill-opacity="0.16"/><text x="736" y="308" text-anchor="start" font-size="15.5" font-weight="600" fill="#f2efe8">Copywriter</text><text x="736" y="327" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.5" fill="#9a978f">CLOUD MODEL</text><circle cx="968" cy="225" r="30" fill="#06070a" stroke="#c9a96e" stroke-width="1.8"/><circle cx="968" cy="225" r="21" fill="#c9a96e" fill-opacity="0.35"/><text x="968" y="279" text-anchor="middle" font-size="15.5" font-weight="600" fill="#f2efe8">Delivers</text><text x="968" y="298" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.5" fill="#9a978f">CLOUD MODEL</text><path d="M1000 225 H1032" stroke="#c9a96e" stroke-width="1.6"/><path d="M1028 220 l6 5 l-6 5" fill="none" stroke="#c9a96e" stroke-width="1.6"/><rect x="1040" y="130" width="176" height="190" rx="12" fill="#c9a96e" fill-opacity="0.09" stroke="#c9a96e" stroke-opacity="0.75"/><text x="1060" y="164" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="2" fill="#c9a96e">RESULT</text><path d="M1062 192 l4 4 l8 -9" fill="none" stroke="#dfc38e" stroke-width="1.6"/><text x="1082" y="197" font-size="15" fill="#f2efe8">Every file</text><path d="M1062 218 l4 4 l8 -9" fill="none" stroke="#dfc38e" stroke-width="1.6"/><text x="1082" y="223" font-size="15" fill="#f2efe8">Every version</text><path d="M1062 244 l4 4 l8 -9" fill="none" stroke="#dfc38e" stroke-width="1.6"/><text x="1082" y="249" font-size="15" fill="#f2efe8">Open in browser</text><path d="M1062 270 l4 4 l8 -9" fill="none" stroke="#dfc38e" stroke-width="1.6"/><text x="1082" y="275" font-size="15" fill="#f2efe8">Finish the rest</text><path d="M1062 296 l4 4 l8 -9" fill="none" stroke="#dfc38e" stroke-width="1.6"/><text x="1082" y="301" font-size="15" fill="#f2efe8">Export for bugs</text>
  <text x="64" y="410" font-size="15" fill="#9a978f">Teams on any mix of models. On local models, a few agents run one after another, sized to one computer.</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="17.5" fill="none" stroke="#c9a96e" stroke-opacity="0.35"/>
</svg>
