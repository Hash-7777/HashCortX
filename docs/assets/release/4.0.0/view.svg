<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 604" width="1280" height="604" role="img" aria-label="Every answer shows where it came from. While it works: what it is doing now, such as looking up Eiffel Tower on Wikipedia; each part of your question, with a line to the source that gives it; and each source it read as a card. Once it is done: the answer with a numbered mark after each sentence a source backs and a question mark after one nothing read supports; each part at a glance; how many sentences come from what it read; and a box to check before relying on it, listing what is not in anything it read.">
