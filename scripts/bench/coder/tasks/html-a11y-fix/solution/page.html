<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbour Bakery</title>
</head>
<body>
  <header>
    <img src="logo.svg" width="120" height="40" alt="Harbour Bakery">
    <button class="menu" type="button" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor"/></svg>
    </button>
  </header>
  <main>
    <h1>Fresh bread every morning</h1>
    <img src="sourdough.jpg" width="600" height="400" alt="A sourdough loaf on a wooden board">
    <p>Baked before sunrise on the harbour road since 1998.</p>
    <img src="croissants.jpg" width="600" height="400" alt="A tray of fresh croissants">
    <form action="/subscribe" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">
      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
