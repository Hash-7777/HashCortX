<template data-mode-tab>
  <button class="tab" data-tab="systems" id="tabSystems" title="ERP — a business system you build and change by asking">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/><path d="M3 9h18"/><path d="M12 13h5"/><path d="M12 17h3"/></svg>
    ERP
  </button>
</template>

<!-- ══════════════════════════════════════════════════════════════
     ERP — the system itself fills the mode; everything else is a
     thin bar above it and an agent you talk to.
     Shown when body.system-maker-mode is active.
     ══════════════════════════════════════════════════════════════ -->

<div id="system-maker-wrap">

  <!-- The thin bar: which system, its history, and getting data in and out -->
  <div class="sys-bar" role="toolbar" aria-label="System">
    <div class="sys-menu-wrap">
      <button class="sys-bar-btn sys-switch-btn" id="sysSwitchBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Your systems">
        <span class="sys-switch-name" id="sysPreviewName">My business</span>
        <svg class="sys-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <div class="sys-menu sys-switch-menu" id="sysSwitchMenu" role="menu" hidden>
        <div class="sys-system-list" id="sysSystemList"></div>
        <div class="sys-menu-sep" role="separator"></div>
        <button class="sys-menu-item" id="sysNewBtn" type="button" role="menuitem">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span>New empty system</span>
        </button>
        <button class="sys-menu-item" id="sysResetDataBtn" type="button" role="menuitem">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 3v3h3"/></svg><span>Put back the records it was built with</span>
        </button>
      </div>
    </div>
    <span class="sys-bar-desc" id="sysPreviewDesc"></span>

    <div class="sys-bar-right">
      <button class="sys-bar-btn" id="sysUndoWorkBtn" type="button" title="Put the records back the way they were before the agent's last change" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4 2 7l3 3"/><path d="M2 7h7a4 4 0 0 1 0 8H7"/></svg><span>Undo last change</span>
      </button>
      <div class="sys-menu-wrap">
        <button class="sys-bar-btn" id="sysHistoryBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Earlier versions of this system">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg><span>History</span>
        </button>
        <div class="sys-menu" id="sysHistoryMenu" role="menu" hidden>
          <div class="sys-version-list" id="sysVersionList"></div>
        </div>
      </div>
      <div class="sys-menu-wrap sys-preview-export-wrap">
        <button class="sys-bar-btn" id="sysPreviewExportMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3"/><path d="M3 12v1.5h10V12"/></svg><span>Export</span>
        </button>
        <div id="sysPreviewExportMenu" class="sys-menu sys-preview-export-menu" role="menu" aria-hidden="true" hidden>
          <button class="sys-menu-item sys-preview-export-item" data-preview-export="json" role="menuitem" type="button"><span>Backup (JSON)</span></button>
          <button class="sys-menu-item sys-preview-export-item" data-preview-export="csv" role="menuitem" type="button"><span>This table (CSV)</span></button>
          <button class="sys-menu-item sys-preview-export-item" data-preview-export="app" role="menuitem" type="button" title="One file that runs this system in any browser"><span>App to share (.html)</span></button>
        </div>
      </div>
      <button class="sys-bar-btn" id="sysPreviewImportBtn" type="button" title="Bring records in from a CSV file">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 5l3-3 3 3"/><path d="M3 12v1.5h10V12"/></svg><span>Import</span>
      </button>
    </div>
  </div>

  <!-- The system, full size -->
  <div class="sys-preview-shell" id="sysPreviewShell">
    <div class="sys-app-host" id="sysAppHost"></div>
  </div>

  <!-- The agent: a button that stays in the corner, and the conversation it opens -->
  <button class="sys-agent-fab" id="sysAgentFab" type="button" aria-controls="sysAgent" aria-expanded="false" title="Talk to the ERP agent">
    <img src="/assets/logo-mark.png" alt="" draggable="false"/>
    <span class="sys-agent-fab-ring" aria-hidden="true"></span>
  </button>
  <section class="sys-agent" id="sysAgent" role="dialog" aria-label="ERP agent" hidden>
    <header class="sys-agent-head">
      <img class="sys-agent-logo" src="/assets/logo-mark.png" alt="" draggable="false"/>
      <div class="sys-agent-titles">
        <div class="sys-agent-title">ERP agent</div>
        <div class="sys-agent-status" id="sysRunStatus" role="status">Ready</div>
      </div>
      <select class="sys-agent-model" id="sysModelSelect" aria-label="Which model the agent uses"></select>
      <button class="sys-icon-btn" id="sysAgentClear" type="button" title="Start a new conversation" aria-label="Start a new conversation">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M6 4V2.5h4V4M4.5 4l.6 9.5h5.8l.6-9.5"/></svg>
      </button>
      <button class="sys-icon-btn" id="sysAgentClose" type="button" title="Close" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </header>
    <div class="sys-agent-log" id="sysAgentLog" aria-live="polite"></div>
    <form class="sys-agent-compose" id="sysAgentForm">
      <textarea id="sysAgentInput" rows="2" placeholder="Ask for a system, a change, or anything about your records" aria-label="Message the ERP agent"></textarea>
      <button class="sys-agent-send" id="sysAgentSend" type="submit" aria-label="Send">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
      </button>
      <button class="sys-agent-send sys-agent-stop" id="sysAgentStop" type="button" aria-label="Stop" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1"/></svg>
      </button>
    </form>
  </section>

  <!-- Import modal -->
  <div class="amk-dialog" id="sysImportModal" style="z-index:310;">
    <div class="amk-dialog-inner" style="width:440px;max-width:95vw;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:13px;font-weight:700;color:var(--text);" id="sysImportTitle">Import</span>
        <button class="amk-btn" id="sysImportClose" style="padding:4px 9px;">&#215;</button>
      </div>
      <div id="sysImportBody" style="font-size:12px;color:var(--muted);margin-bottom:10px;"></div>
      <div id="sysImportCount" style="font-size:11px;font-family:var(--mono);color:var(--sys-accent);margin-bottom:14px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="amk-btn" id="sysImportCancel">Cancel</button>
        <button class="amk-btn primary" id="sysImportConfirm" disabled>Import</button>
      </div>
    </div>
  </div>

  <!-- Record modal (create / edit record) -->
  <div class="amk-dialog" id="sysRecordModal" style="z-index:320;">
    <div class="amk-dialog-inner" style="width:500px;max-width:96vw;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <span style="font-size:14px;font-weight:700;color:var(--text);" id="sysRecordModalTitle">New Record</span>
        <button class="amk-btn" id="sysRecordModalClose" style="padding:4px 9px;">&#215;</button>
      </div>
      <form id="sysRecordModalForm" style="display:flex;flex-direction:column;gap:10px;"></form>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="amk-btn" id="sysRecordModalCancel" type="button">Cancel</button>
        <button class="amk-btn primary" id="sysRecordModalSave" type="submit">Save</button>
      </div>
    </div>
  </div>

</div><!-- /#system-maker-wrap -->
