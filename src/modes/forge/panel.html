<template data-mode-tab>
  <button class="tab" data-tab="forge" id="tabForge" title="3D Forge — architecture-first 3D agent swarm planning">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v12l8 4 8-4V6l-8-4Z"/><path d="M12 22V10"/><path d="m4 6 8 4 8-4"/><path d="m7.5 8.2 9-4.4"/><circle cx="12" cy="10" r="2"/></svg>
    3D Forge
  </button>
</template>

<!-- ══════════════════════════════════════════════════════════════
     FORGE MODE — 3D model forge
     Shown when body.forge-studio-mode is active
     ══════════════════════════════════════════════════════════════ -->

<div id="forge-mode-wrap">

  <!-- Header bar -->
  <div class="frg-header">

    <!-- Left: logo + project info -->
    <div class="frg-header-left">
      <img src="/assets/logo-mark.png" class="frg-logo mode-logo-img" draggable="false" alt="HashCortx"/>
      <div>
        <div class="frg-title">Forge Studio</div>
        <span class="frg-sub" id="frgPlanName">No project loaded</span>
      </div>
    </div>

    <!-- Center: prompt + generate -->
    <div class="frg-prompt-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="frgPrompt" type="text" placeholder="Describe a 3D model… e.g. 'a sleek futuristic chair'" autocomplete="off" />
      <button class="frg-btn primary" id="frgGodBtn">Generate</button>
    </div>

    <!-- Gen controls: style / detail / output — display:contents so they slot into header grid -->
    <div class="frg-gen-controls">
      <label>
        <span>Style</span>
        <select id="frgStyle">
          <option value="realistic">Realistic</option>
          <option value="stylized">Stylized</option>
          <option value="low-poly">Low-Poly</option>
          <option value="wireframe">Wireframe</option>
          <option value="cartoon">Cartoon</option>
        </select>
      </label>
      <label>
        <span>Detail</span>
        <select id="frgDetail">
          <option value="low">Low</option>
          <option value="balanced" selected>Balanced</option>
          <option value="high">High</option>
        </select>
      </label>
      <label>
        <span>Export as</span>
        <select id="frgOutputTarget">
          <option value="glb">GLB</option>
          <option value="gltf">GLTF</option>
          <option value="stl">STL</option>
          <option value="obj">OBJ</option>
        </select>
      </label>
    </div>

    <!-- Right: status + action buttons -->
    <div class="frg-header-right">
      <span class="frg-status" id="frgStatus">Idle</span>
      <span id="frgParticleCount" style="font-family:var(--mono);font-size:9px;color:rgba(223,251,245,0.42);letter-spacing:.08em;"></span>
      <button class="frg-btn" id="frgMockBtn">Mock</button>
      <button class="frg-btn" id="frgAutoRouteBtn">Auto</button>
      <button class="frg-btn" id="frgSaveProjectBtn">Save</button>
      <button class="frg-btn" id="frgNewProjectBtn">New</button>
      <button class="frg-icon-btn" id="frgResetViewBtn" title="Reset camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
      </button>
      <button class="frg-btn" id="frgBackBtn">&#8592; Back</button>
    </div>

  </div><!-- /.frg-header -->

  <!-- Body: 3D viewport + side panel -->
  <div class="frg-body">

    <!-- 3D canvas viewport -->
    <div class="frg-viewport">
      <div id="frgCanvasMount"></div>

      <!-- HUD: node count badge -->
      <div class="frg-viewport-hud">
        <span id="frgNodeCount">0 nodes</span>
      </div>

      <!-- Tool rail. Same data-frg-tool values as the row of labelled
           buttons it replaces, so every handler is untouched: thirteen
           words across the top of the viewport became icons down its
           side, with the shortcut on the key that has one. -->
      <div class="frg-cad-toolbar" id="frgCadToolbar">
        <button class="frg-cad-btn" data-frg-tool="selectObject" title="Select the whole object (A)" aria-label="Select the whole object"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3l7 17 2.5-6.5L20 11z"/></svg><span class="frg-cad-kbd">A</span></button>
        <button class="frg-cad-btn active" data-frg-tool="translate" title="Move selected part (W)" aria-label="Move selected part"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="frg-cad-kbd">W</span></button>
        <button class="frg-cad-btn" data-frg-tool="rotate" title="Rotate selected part (R)" aria-label="Rotate selected part"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v6h-6"/></svg><span class="frg-cad-kbd">R</span></button>
        <button class="frg-cad-btn" data-frg-tool="scale" title="Resize selected part (S)" aria-label="Resize selected part"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L20 4"/><path d="M14 4h6v6"/><path d="M4 14v6h6"/></svg><span class="frg-cad-kbd">S</span></button>
        <span class="frg-cad-sep"></span>
        <button class="frg-cad-btn" data-frg-tool="snap" title="Toggle snapping" aria-label="Toggle snapping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
        <button class="frg-cad-btn" data-frg-tool="duplicate" title="Duplicate selected part (D)" aria-label="Duplicate selected part"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span class="frg-cad-kbd">D</span></button>
        <button class="frg-cad-btn" data-frg-tool="floor" title="Drop selected part to the floor" aria-label="Drop selected part to the floor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg></button>
        <span class="frg-cad-sep"></span>
        <button class="frg-cad-btn" data-frg-tool="focus" title="Frame the selection (F)" aria-label="Frame the selection"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg><span class="frg-cad-kbd">F</span></button>
        <button class="frg-cad-btn" data-frg-tool="camUp" title="Pan the camera up" aria-label="Pan the camera up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V7M7 12l5-5 5 5"/></svg></button>
        <button class="frg-cad-btn" data-frg-tool="camDown" title="Pan the camera down" aria-label="Pan the camera down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v13M7 12l5 5 5-5"/></svg></button>
        <span class="frg-cad-sep"></span>
        <button class="frg-cad-btn" data-frg-tool="import" title="Import a GLB or GLTF mesh" aria-label="Import a GLB or GLTF mesh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
        <span class="frg-export-wrap">
          <button class="frg-cad-btn" data-frg-tool="exportMenu" title="Export model" aria-label="Export model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
          <span class="frg-export-menu" id="frgExportMenu">
            <button data-frg-export-kind="glb">GLB</button>
            <button data-frg-export-kind="obj">OBJ</button>
            <button data-frg-export-kind="stl">STL</button>
          </span>
        </span>
        <span class="frg-cad-sep"></span>
        <button class="frg-cad-btn danger" data-frg-tool="delete" title="Delete selected part (Del)" aria-label="Delete selected part"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <input id="frgAssetImport" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden />
      </div>
      <!-- Keyboard hint -->
      <div class="frg-help">Click to select &middot; W/R/S transform &middot; A select-all &middot; D duplicate &middot; Del remove</div>
    </div><!-- /.frg-viewport -->

    <!-- Right side panel -->
    <div class="frg-panel">

      <!-- Agents -->
      <div class="frg-panel-section">
        <div class="frg-panel-label">Agents</div>
        <div class="frg-agent-list" id="frgAgents">
          <!-- Populated by JS: renderAgents() -->
        </div>
      </div>

      <!-- Pipeline stage indicators -->
      <div class="frg-panel-section">
        <div class="frg-panel-label">Pipeline</div>
        <div class="frg-stage-list">
          <div class="frg-stage" data-frg-stage="input">
            <b>Input</b><span>prompt ready</span>
          </div>
          <div class="frg-stage" data-frg-stage="generate">
            <b>Generate</b><span>waiting</span>
          </div>
          <div class="frg-stage" data-frg-stage="refine">
            <b>Refine</b><span>waiting</span>
          </div>
          <div class="frg-stage" data-frg-stage="export">
            <b>Export</b><span>waiting</span>
          </div>
        </div>
      </div>

      <!-- Projects -->
      <div class="frg-panel-section">
        <div class="frg-panel-label-row">
          <span class="frg-panel-label" style="margin-bottom:0">Projects</span>
        </div>
        <div class="frg-project-list" id="frgProjectsList">
          <!-- Populated by JS: renderForgeProjects() -->
        </div>
      </div>

      <!-- Plan / nodes list -->
      <div class="frg-panel-section grow">
        <div class="frg-panel-label">Plan</div>
        <div class="frg-plan-list" id="frgPlanList">
          <!-- Populated by JS: updatePlanList() -->
        </div>
      </div>

      <!-- Selection inspector card -->
      <div class="frg-panel-section">
        <div class="frg-panel-label">Selection</div>
        <div class="frg-selection-card" id="frgSelectionCard">
          <div class="frg-selection-empty">Click a mesh in the 3D viewport to inspect it.</div>
        </div>
      </div>

    </div><!-- /.frg-panel -->

  </div><!-- /.frg-body -->

  <!-- Trace console (bottom collapsible drawer) -->
  <div class="frg-trace-console collapsed" id="frgTraceConsole">
    <div class="frg-trace-header" id="frgTraceToggle">
      <span class="frg-trace-dot" id="frgTraceDot"></span>
      <span class="frg-trace-label">Trace</span>
      <span class="frg-trace-summary" id="frgTraceSummary">No run yet</span>
      <div class="frg-trace-actions">
        <button class="frg-trace-btn" id="frgTraceCopyBtn" title="Copy the whole trace to the clipboard">Copy</button>
        <button class="frg-trace-btn" id="frgTraceExportBtn" title="Save the whole trace as a text file">Export</button>
        <button class="frg-trace-btn" id="frgTraceClearBtn">Clear</button>
      </div>
      <svg class="frg-trace-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="frg-trace-entries" id="frgTraceEntries"></div>
  </div>

</div><!-- /#forge-mode-wrap -->
