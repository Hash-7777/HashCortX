<div id="sandbox-wrap">
  <div class="sbx-header">
    <div class="sbx-header-left">
      <span class="sbx-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      </span>
      <span class="sbx-title">SANDBOX SCANNER</span>
      <span class="sbx-sub">// malware · trojans · injections · exfiltration</span>
    </div>
    <div class="sbx-header-right">
      <button id="sbxStopBtn" class="sbx-stop-btn" style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor" width="10" height="10"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        STOP SCAN
      </button>
      <button class="sbx-back-btn" id="sbxBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><polyline points="15 18 9 12 15 6"/></svg>
        EXIT
      </button>
    </div>
  </div>
  <div class="sbx-body">
    <div class="sbx-input-col">
      <div class="sbx-section-label">// PASTE CODE OR FILE CONTENTS</div>
      <textarea id="sbxCodeInput" class="sbx-code-input" placeholder="Paste code, scripts, config files, or any application contents you want scanned for malware, trojans, backdoors, keyloggers, injections, and suspicious behavior…"></textarea>
      <div class="sbx-model-row">
        <div class="sbx-section-label" style="margin:0">// BOSS LLM</div>
        <select id="sbxModelSelect" class="sbx-model-select">
          <option value="">— loading models —</option>
        </select>
      </div>
      <div class="sbx-model-row" style="gap:6px">
        <div class="sbx-section-label" style="margin:0;white-space:nowrap">// SWARM</div>
        <button id="sbxSwarmConfigBtn" class="sbx-swarm-config-btn" title="Configure swarm agents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M8.46 8.46a5 5 0 0 0 0 7.07"/></svg>
          <span id="sbxSwarmLabel">4 AGENTS</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="9" height="9" id="sbxSwarmChevron"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <!-- Swarm config popup panel -->
      <div id="sbxSwarmPanel" class="sbx-swarm-panel" style="display:none">
        <div class="sbx-swarm-panel-header">
          <span class="sbx-section-label" style="margin:0">// SWARM AGENTS</span>
          <div class="sbx-swarm-controls">
            <button id="sbxRemoveAgent" class="sbx-swarm-ctrl-btn" title="Remove last agent">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="10" height="10"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <span id="sbxAgentCountLabel" class="sbx-agent-count">4 agents</span>
            <button id="sbxAddAgent" class="sbx-swarm-ctrl-btn" title="Add agent">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="10" height="10"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button id="sbxSwarmPanelClose" class="sbx-swarm-ctrl-btn" title="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="10" height="10"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div id="sbxAgentSlots" class="sbx-agent-slots"></div>
      </div>
      <div class="sbx-actions">
        <button id="sbxScanBtn" class="sbx-scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          RUN SECURITY SCAN
        </button>
      </div>
      <div class="sbx-section-label" style="margin-top:12px">// LIVE SCAN LOG</div>
      <div id="sbxLog" class="sbx-log">
        <div class="sbx-log-idle">Awaiting input… paste code above and hit RUN.</div>
      </div>
    </div>
    <div class="sbx-history-col">
      <div class="sbx-history-header">
        <div class="sbx-section-label">// SCAN HISTORY</div>
        <div id="sbxVerdictBadge" class="sbx-verdict-badge" style="display:none"></div>
      </div>
      <div id="sbxHistory" class="sbx-history">
        <div class="sbx-history-empty">No scans yet. Paste code and hit RUN SECURITY SCAN.</div>
      </div>
    </div>
  </div>
</div>
