<div class="modal-overlay" id="memMapOverlay" style="z-index:100005">
  <div class="modal mem-map-modal" role="dialog" aria-labelledby="memMapTitle" aria-modal="true">
    <div class="modal-header">
      <h2 class="modal-title" id="memMapTitle">Memory map</h2>
      <button class="close-btn" id="memMapClose" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body mem-map-body">
      <div id="memMapHint">Drag to move · scroll to zoom · double-click a fact to edit</div>
      <div id="memMapTools">
        <button type="button" id="memMapZoomIn"  title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button type="button" id="memMapZoomOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button type="button" id="memMapFit"     title="Fit view" aria-label="Fit view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 4 20 10 20"/><polyline points="20 10 20 4 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
        <button type="button" id="memMapReset"   title="Reset positions" aria-label="Reset positions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"/><polyline points="3 21 3 16 8 16"/></svg></button>
      </div>
      <div id="memMapDetail"><span style="color:var(--text-dim)">Hover or click a node...</span></div>
      <svg id="memMapSvg" width="100%" height="100%" style="display:block;width:100%;height:100%" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="mmCenterHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="rgba(57,255,129,0.55)"/>
            <stop offset="60%" stop-color="rgba(57,255,129,0.15)"/>
            <stop offset="100%" stop-color="rgba(57,255,129,0)"/>
          </radialGradient>
          <radialGradient id="mmCenterCore" cx="35%" cy="30%" r="80%">
            <stop offset="0%"  stop-color="#b0ffe0"/>
            <stop offset="55%" stop-color="#39ff81"/>
            <stop offset="100%" stop-color="#1a7a40"/>
          </radialGradient>
          <pattern id="mmGridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <path class="mm-grid" d="M 40 0 L 0 0 0 40"/>
          </pattern>
          <filter id="mmGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect id="mmGridBg" x="-4000" y="-4000" width="8000" height="8000" fill="url(#mmGridPattern)"/>
        <g id="mmWorld"></g>
      </svg>
    </div>
  </div>
</div>
