<div class="modal-overlay" id="memMapOverlay" style="z-index:100005">
  <div class="modal mem-map-modal" role="dialog" aria-labelledby="memMapTitle" aria-modal="true">
    <div class="modal-header">
      <h2 class="modal-title" id="memMapTitle">Memory map</h2>
      <button class="close-btn" id="memMapClose" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body mem-map-body">
      <!-- The controls are a row, not glass floating over the picture: the same
           shape as the toolbar in the Memory pane this map opens from. -->
      <div class="mm-bar">
        <input class="control mm-search" id="memMapSearch" placeholder="Search the map…" spellcheck="false" aria-label="Search the map" />
        <button type="button" class="ghost mm-layout" id="memMapLayout" title="Switch how the facts are placed">By meaning</button>
        <span class="mm-bar-gap"></span>
        <div class="mm-zoom" role="group" aria-label="View">
          <button type="button" id="memMapZoomOut" title="Zoom out  ( − )" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="20.5" y1="20.5" x2="16" y2="16"/></svg></button>
          <button type="button" id="memMapZoomIn" title="Zoom in  ( + )" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="20.5" y1="20.5" x2="16" y2="16"/></svg></button>
          <button type="button" id="memMapFit" title="Fit everything on screen  ( 0 )" aria-label="Fit everything on screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 4 20 10 20"/><polyline points="20 10 20 4 14 4"/><line x1="14" y1="10" x2="20" y2="4"/><line x1="4" y1="20" x2="10" y2="14"/></svg></button>
          <button type="button" id="memMapReset" title="Put everything back where it belongs" aria-label="Reset positions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"/><polyline points="3 21 3 16 8 16"/></svg></button>
        </div>
      </div>
      <!-- Filled in by core/memory/map.js: which layout is live, and how much
           of the truth this flat picture keeps. -->
      <p class="mm-legend" id="memMapHint">Reading the memory…</p>
      <div class="mm-canvas">
        <svg id="memMapSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="Memory map">
          <defs>
            <pattern id="mmGridPattern" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
              <path class="mm-grid" d="M 48 0 L 0 0 0 48"/>
            </pattern>
          </defs>
          <rect id="mmGridBg" x="-4000" y="-4000" width="8000" height="8000" fill="url(#mmGridPattern)"/>
          <g id="mmWorld"></g>
        </svg>
      </div>
      <div class="mm-detail" id="memMapDetail"></div>
    </div>
  </div>
</div>
