<div class="modal-overlay" id="agentOverlay">
  <div class="modal" role="dialog" aria-labelledby="agentTitle" aria-modal="true">
    <div class="modal-header">
      <h2 id="agentTitle">New agent</h2>
      <button class="close-btn" id="closeAgent" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Icon</label>
        <div class="icon-picker" id="iconPicker"></div>
      </div>

      <div class="field">
        <label>Name</label>
        <input class="control" id="agentName" placeholder="e.g. Researcher" />
      </div>

      <div class="field">
        <label>Short description</label>
        <input class="control" id="agentDesc" placeholder="What does this agent do?" />
      </div>

      <div class="field">
        <label>System prompt</label>
        <textarea class="control" id="agentSystem" rows="8" placeholder="You are a helpful assistant that..."></textarea>
      </div>

      <div class="field">
        <label>Tools (give the model real-world powers)</label>
        <label class="tool-option">
          <input type="checkbox" id="toolWiki" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true" style="vertical-align:-1px"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg> Wikipedia research</div>
            <div class="tool-desc">Before each reply, search Wikipedia for your question and inject the top 3 articles as context. Works right now, no API key, CORS-friendly.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolWebSearch" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true" style="vertical-align:-1px"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c-2 2.5-2.5 4-2.5 6s.5 3.5 2.5 6M8 2c2 2.5 2.5 4 2.5 6s-.5 3.5-2.5 6"/></svg> Google Web Search</div>
            <div class="tool-desc">Live web results via Google Custom Search. Requires an API key + Search Engine ID in Settings. Falls back to Wikipedia if missing.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolFetchUrl" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><path d="M5.5 10.5a3 3 0 004.24 0l2-2a3 3 0 00-4.24-4.24L6.5 5.5"/><path d="M10.5 5.5a3 3 0 00-4.24 0l-2 2a3 3 0 004.24 4.24l1-1"/></svg> Fetch URL content</div>
            <div class="tool-desc">If your message contains a URL, fetch the page and pass its text as context.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolPubmed" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><rect x="2" y="2" width="5" height="12" rx="0.5"/><rect x="9" y="3" width="5" height="11" rx="0.5"/></svg> PubMed / Europe PMC (medical papers)</div>
            <div class="tool-desc">Before each reply, search Europe PMC (which indexes PubMed + preprints + life-sciences journals) for your question and inject the top 5 abstracts as context with PMIDs and DOIs. CORS-friendly, no API key needed.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolMemory" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true" style="vertical-align:-1px"><circle cx="5" cy="5" r="1.5"/><circle cx="11" cy="5" r="1.5"/><circle cx="8" cy="11" r="1.5"/><path d="M5 6.5v2.5c0 .8.7 1.5 1.5 1.5H8M11 6.5v2.5c0 .8-.7 1.5-1.5 1.5H8"/></svg> Persistent memory (remember + recall)</div>
            <div class="tool-desc">Real cross-session memory. The agent can call <code>remember_fact</code> to save things and <code>recall_facts</code> to look them up. Stored in your browser only. Works on every model — falls back to context injection on models that don't support tool-calling.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolDatetime" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><circle cx="8" cy="8" r="6"/><path d="M8 4.4V8l2.4 1.4"/></svg> Current date/time</div>
            <div class="tool-desc">Lets the agent ask for the real current date, time, and timezone. Resolved locally — no network call.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolCalc" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><rect x="3" y="1.6" width="10" height="12.8" rx="1.4"/><path d="M5.4 4.6h5.2"/><path d="M5.6 7.8h.01M8 7.8h.01M10.4 7.8h.01M5.6 10.6h.01M8 10.6h.01M10.4 10.6h.01"/></svg> Calculator</div>
            <div class="tool-desc">Sandboxed math evaluator (numbers + - * / % ** parentheses, sin/cos/log/sqrt). Stops the model from hallucinating arithmetic.</div>
          </div>
        </label>
        <label class="tool-option">
          <input type="checkbox" id="toolPython" />
          <div>
            <div class="tool-name"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><polyline points="5.6,5 2.6,8 5.6,11"/><polyline points="10.4,5 13.4,8 10.4,11"/><path d="M9.2 3.4L6.8 12.6"/></svg> Code interpreter (Python sandbox)</div>
            <div class="tool-desc">Real Python via Pyodide (WebAssembly) with <code>python-docx</code>, <code>openpyxl</code>, <code>reportlab</code>, pandas, numpy, matplotlib. The agent can generate <b>Word, Excel and PDF</b> files — anything the model writes to <code>/output/</code> auto-downloads to your computer. First call loads ~10 MB and takes a few seconds; subsequent calls are instant.</div>
          </div>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="ghost" id="deleteAgentBtn" style="margin-right:auto;display:none;color:var(--rose)">Delete</button>
      <button class="ghost" id="cancelAgentBtn">Cancel</button>
      <button class="primary" id="saveAgentBtn">Save</button>
    </div>
  </div>
</div>
