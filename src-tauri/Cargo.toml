# ==============================================================
# HashCortx — Rust package manifest
#
# This file defines the Rust crate that powers the native side
# of HashCortx. Tauri apps have two halves:
#   • src/          → JavaScript/HTML frontend (UI layer)
#   • src-tauri/    → Rust backend (OS access, security, plugins)
#
# HOW TO UPDATE VERSIONS:
#   Run `cargo update` to bump all deps to latest minor versions.
#   For major version bumps, check the Tauri migration guide first:
#   https://tauri.app/start/migrate/
# ==============================================================

[package]
name        = "hashcortx"
version     = "2.5.0"
description = "HashCortx — Local-first AI coding agents"
authors     = ["HashCortx"]
edition     = "2021"   # Use Rust 2021 edition (latest stable feature set)

# Minimum Rust version — guards against ancient toolchains that
# lack features we rely on (e.g. GATs, edition 2021 imports).
rust-version = "1.77.2"

# ── Library target ─────────────────────────────────────────────
# We expose a library crate (hashcortx_lib) so tests and the
# mobile entry point can call run() directly.
#   staticlib  → used by iOS (static linking)
#   cdylib     → used by Android (dynamic linking)
#   rlib       → used by the Rust test harness
[lib]
name       = "hashcortx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ── Build dependencies ─────────────────────────────────────────
# These only run at compile time to generate Tauri boilerplate.
# tauri-build generates the required bindings from tauri.conf.json.
#
# config-json5: allows // and /* */ comments in tauri.conf.json.
# Without this feature, the Cargo build step uses strict JSON and
# rejects inline comments. Never remove this feature.
[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

# ==============================================================
# Runtime dependencies
#
# ADDING A NEW PLUGIN (Phase 3+):
#   1. Add it here: tauri-plugin-xxx = "2"
#   2. Register it in src/lib.rs: .plugin(tauri_plugin_xxx::init())
#   3. Add its permissions to src-tauri/capabilities/default.json
#   4. Document what it enables in the comment below
#
# ⚠ Only add plugins you actively use. Each plugin expands the
#   attack surface — unused plugins are unnecessary risk.
# ==============================================================
[features]
default = ["local-embeddings"]

# ── local-embeddings ─────────────────────────────────────────
# Semantic search over the knowledge base, run on this machine: the
# bge-small-en-v1.5 weights and the ONNX Runtime that executes them are both
# compiled into the binary.
#
# WHY THIS IS A FEATURE AND NOT SIMPLY ALWAYS ON
# ----------------------------------------------
# The prebuilt ONNX Runtime that `ort`'s download-binaries fetches is built
# for x86-64 processors with AVX2 and BMI2 — Intel Haswell (2013) and AMD
# Excavator (2015) and newer. It is linked statically, so its C++ start-up
# code runs while the process is still loading, before main(). On an older
# processor that code executes an instruction the CPU does not implement and
# Windows kills the process with STATUS_ILLEGAL_INSTRUCTION.
#
# The failure is invisible: no window, no error, no log — a double-click that
# appears to do nothing at all. It cannot be avoided by leaving the feature
# unused in the interface, because nothing of ours has run yet by the time it
# happens.
#
# Building without this feature produces an app that starts on any x86-64
# machine. The knowledge base then finds passages by keyword rather than by
# meaning, `embed_available` reports false, and the interface says so instead
# of pretending. Nothing else changes, and the binary is around 60 MB smaller
# because neither the runtime nor the weights are compiled in.
#
#   cargo build --release --no-default-features
#   npm run tauri build -- --no-default-features
local-embeddings = ["dep:ort", "dep:tokenizers"]

[dependencies]

# ── Core Tauri framework ──────────────────────────────────────
# The runtime that creates the window, WebView, IPC bridge, and
# capability permission system.
#
# config-json5: must match the feature in tauri-build above.
# Both crates need to agree on the config format at build time.
tauri = { version = "2", features = ["config-json5"] }

# ── tauri-plugin-opener ──────────────────────────────────────
# Opens files and URLs in the OS default app.
# Used for: opening external links, system file viewer.
# Phase: 0 (already active)
tauri-plugin-opener = "2"

# ── tauri-plugin-shell ──────────────────────────────────────
# Runs shell commands and spawns child processes.
# Used for: Code Mode terminal execution (Phase 4).
# Phase: 4 — registered now so capabilities are wired, but
#   no JS calls it until Phase 4 adds the terminal UI.
# ⚠ All commands must be allowlisted in tauri.conf.json before
#   the JS side can call them. Nothing executes without that gate.
tauri-plugin-shell = "2"

# ── tauri-plugin-fs ─────────────────────────────────────────
# Read/write the real filesystem (outside the WebView sandbox).
# Used for: Code Mode file operations (Phase 4), project loading.
# Phase: 4
# ⚠ Scope limited in capabilities — only paths the user grants.
tauri-plugin-fs = "2"

# ── tauri-plugin-dialog ─────────────────────────────────────
# Native OS file picker and confirmation dialogs.
# Used for: "Open Project" dialog, permission-guard confirmations.
# Phase: 3 (Permission Guard) and 4 (Code Mode file open)
tauri-plugin-dialog = "2"

# ── tauri-plugin-store ──────────────────────────────────────
# Persistent key-value store backed by a JSON file on disk.
# Used for: user preferences, recent projects, UI state.
# NOT used for API keys — those go in the OS Keychain (Phase 2).
# Phase: 0 (already active for future use)
tauri-plugin-store = "2"

# ── tauri-plugin-notification ───────────────────────────────
# Native OS push notifications.
# Used for: long-running agent task completion alerts.
# Phase: 5+
tauri-plugin-notification = "2"

# ── serde + serde_json ──────────────────────────────────────
# Serialization/deserialization framework.
# Required by Tauri's IPC bridge to pass structs between
# Rust commands and JavaScript callers.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── keyring ──────────────────────────────────────────────────
# Cross-platform OS keychain (Windows Credential Manager, Linux Secret Service).
# macOS uses security-framework directly (see below) to avoid binary-bound ACLs.
keyring = "3"

# ── ort + tokenizers ─────────────────────────────────────────
# Local sentence embeddings for the knowledge base: bge-small-en-v1.5 run
# natively, so semantic search needs no network and no WebAssembly runtime.
# See src/commands/embed.rs for why this is not done in the web view.
#
# ort's "download-binaries" fetches a prebuilt ONNX Runtime at BUILD time and
# links it STATICALLY — the shipped app has no external ONNX dylib to find.
# It costs roughly 28 MB of binary size.
#
# tokenizers is built without default features: the defaults pull a progress
# bar and HTTP model downloading, neither of which belongs in this app. The
# vocabulary is loaded from bytes compiled into the binary.
#
# Both are OPTIONAL, behind the `local-embeddings` feature below. That prebuilt
# ONNX Runtime is compiled for x86-64 processors that have AVX2 and BMI2, and
# static linking means its start-up code runs before main(), so on an older
# processor the app cannot even reach the point of drawing a window. See the
# feature comment for the whole story.
ort        = { version = "2.0.0-rc.10", features = ["download-binaries"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }

# ── chrono ───────────────────────────────────────────────────
# Date/time for audit log timestamps (Phase 3).
chrono      = { version = "0.4", features = ["serde"] }

# ── dirs + shellexpand ───────────────────────────────────────
# dirs: finds home/data dirs cross-platform (audit log path).
# shellexpand: expands ~ in paths for the denylist checker.
dirs        = "5"
shellexpand = "3"

# ── ureq ─────────────────────────────────────────────────────
# The HTTP client behind `net_fetch_text` (src/commands/net.rs), so the agent's
# page reads happen here instead of in the web view.
#
# Why a client here at all: under the Content Security Policy the renderer may
# only reach the hosts named in connect-src, so it could not read an ordinary
# web page; and a renderer fetch resolves the hostname a SECOND time, after
# this crate has checked where it leads. Fetching here lets the connection be
# pinned to the address that was actually checked.
#
# Why ureq specifically: it exposes a Resolver trait, which is what makes that
# pinning possible without hand-writing HTTP. It was already compiled during
# every build of this project — ort-sys uses it to download ONNX Runtime — but
# as a BUILD dependency, so this does add it to the shipped binary.
#
# default-features = false drops rustls; the native-tls feature uses the
# platform's own TLS (Secure Transport, SChannel, OpenSSL) and is the same
# feature set ort-sys already resolves, so no new TLS stack is introduced.
# Deliberately without cookies, json, gzip or proxy support: the agent fetches
# public documents and needs none of them, and each is more surface.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# ==============================================================
# Platform-specific dependencies
#
# ⚠ EVERY TABLE HEADER BELOW THIS POINT ENDS [dependencies].
#
# A `[target.'cfg(…)'.dependencies]` header does not open a subsection of the
# shared dependency list — it opens a DIFFERENT list, and every line after it
# belongs to that one until the next header. So a shared dependency written
# below one of these silently becomes platform-only.
#
# That is not hypothetical. chrono, dirs and shellexpand sat under the macOS
# header for the entire life of this project, which meant the crate did not
# compile on Linux or Windows at all — invisible here, because the only builds
# anyone ran were macOS ones. Add shared dependencies ABOVE this banner.
# ==============================================================

# ── security-framework (macOS only) ──────────────────────────
# Direct access to macOS Generic Password Keychain API.
# Unlike keyring v3, this stores items without an application ACL,
# so keys survive DMG rebuilds without prompts or loss.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"
